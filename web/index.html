<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sopoforix — Support</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <main class="shell">
      <header class="brand">
        <p class="brand-name">Sopoforix</p>
        <h1 class="headline">Support</h1>
        <p class="tagline">
          Sleep Better, Live Better — ask about orders, products, returns, or
          sleep tips. Same agent as the API and CLI.
        </p>
      </header>

      <section class="chat" aria-label="Support conversation">
        <div id="transcript" class="transcript" role="log" aria-live="polite">
          <div class="bubble agent">
            <p>
              Hi — I’m the Sopoforix support agent. Try something like
              “Where is order ORD-1001?” or “What is your return policy?”
            </p>
          </div>
        </div>

        <form id="ask-form" class="composer" autocomplete="off">
          <label class="sr-only" for="question">Your question</label>
          <textarea
            id="question"
            name="question"
            rows="2"
            placeholder="How can we help?"
            required
          ></textarea>
          <button type="submit" id="send-btn">Send</button>
        </form>

        <p id="status" class="status" aria-live="polite"></p>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
